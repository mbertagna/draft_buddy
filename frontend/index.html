<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT BUDDY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Surfaces */
            --surface: #F7F8FA;
            --surface-raised: #FFFFFF;

            /* Brand greens */
            --green-600: #2E7D32;
            --green-500: #43A047;
            --green-50: #E8F5E9;
            --green-700: #1B5E20;

            /* Text */
            --text: #1A1D1F;
            --text-muted: #5F6368;
            --text-on-green: #FFFFFF;

            /* Borders and accents */
            --border: #E2E5EA;
            --on-clock: #E8A317;
            --on-clock-bg: #FFF8E7;
            --danger: #C62828;
            --danger-hover: #B71C1C;
            --neutral: #6B7280;
            --neutral-bg: #F3F4F6;

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-pill: 999px;

            /* Typography */
            --font-ui: "DM Sans", system-ui, -apple-system, sans-serif;
            --font-stats: "IBM Plex Sans", var(--font-ui);
            --font-mono: "IBM Plex Mono", ui-monospace, monospace;
            --text-xs: 12px;
            --text-sm: 13px;
            --text-base: 14px;
            --text-md: 16px;
            --text-lg: 20px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);

            /* RL chip lava gradient (signature - use only on the AI element) */
            --lava-gradient:
                radial-gradient(120% 180% at 0% 50%, #ff8a00 0%, transparent 50%),
                radial-gradient(120% 180% at 100% 50%, #8a2be2 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 0%, #00e5ff 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 100%, #00ff6a 0%, transparent 50%),
                linear-gradient(90deg, #ff0080, #ff8a00, #ffff00, #00ff6a, #00e5ff, #8a2be2, #ff0080);
            --lava-size: 300% 300%;

            /* Header chrome */
            --header-bg: var(--green-500);
            --chip-on-header: rgba(255, 255, 255, 0.18);
            --chip-on-header-hover: rgba(255, 255, 255, 0.26);
        }

        *,
        *::before,
        *::after { box-sizing: border-box; }

        :focus-visible {
            outline: 2px solid var(--green-600);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body { font-family: var(--font-ui); font-size: var(--text-base); color: var(--text); margin: 0; background-color: var(--surface); display: flex; flex-direction: column; height: 100vh; line-height: 1.45; }
        main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        
        #top-panel { flex: 0 0 50%; overflow-y: auto; padding: var(--space-2) var(--space-4); min-height: 100px; display: flex; flex-direction: column; }
        #bottom-panel { flex: 1 1 auto; overflow-y: auto; padding: var(--space-2) var(--space-4); min-height: 100px; background: var(--surface-raised); }

        @media (max-width: 768px) {
            #top-panel,
            #bottom-panel { padding: var(--space-2); }
        }

        .resizer {
            height: 8px;
            cursor: row-resize;
            background-color: var(--neutral-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .resizer:hover { background-color: var(--border); }
        .resizer::after {
            content: "";
            width: 30px;
            height: 4px;
            border-top: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
        }

        /* Header: single sticky draft banner */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--header-bg);
            color: var(--text-on-green);
            box-shadow: var(--shadow-sm);
            padding: var(--space-2) var(--space-3);
        }
        .draft-banner {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            min-height: 48px;
        }
        .draft-clock {
            flex-shrink: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-height: 40px;
            padding-top: 8px;
        }
        .draft-clock-sep { opacity: 0.55; font-weight: 500; }
        #round-pick-display { letter-spacing: 0.02em; }
        #team-on-clock-display { font-weight: 600; opacity: 0.95; }
        .draft-banner-ai {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .draft-banner-ai > .ai-chip {
            flex-shrink: 0;
            margin-top: 4px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: var(--chip-on-header);
            font-weight: 600;
            font-size: var(--text-sm);
            line-height: 1.2;
            white-space: nowrap;
        }
        #ai-suggestion-display {
            display: flex;
            gap: 6px;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .ai-suggestion-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 7px;
            border-radius: 5px;
            color: #fff;
            white-space: nowrap;
        }
        .ai-suggestion-item .ai-pos {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.9;
        }
        .ai-suggestion-item .ai-prob {
            font-size: 0.9rem;
            font-weight: 700;
        }
        .assistant-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }
        .assistant-toggle input { cursor: pointer; }
        #ask-assistant-btn {
            padding: var(--space-2) var(--space-3);
            border: none;
            border-radius: var(--radius-pill);
            background: var(--surface-raised);
            color: var(--green-600);
            font-size: var(--text-sm);
            font-weight: 700;
            cursor: pointer;
            font-family: var(--font-ui);
        }
        #ask-assistant-btn:hover { background: var(--green-50); }
        #ask-assistant-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #assistant-scope-select,
        .assistant-model-select,
        #sim-mode-select {
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-on-green);
            font-size: var(--text-sm);
            font-family: var(--font-ui);
        }
        .assistant-model-select { max-width: 11rem; }
        .assistant-model-label {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-right: 4px;
        }
        .draft-banner-actions {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding-top: 4px;
        }
        .draft-banner-actions > button {
            padding: var(--space-2) var(--space-3);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-on-green);
            font-size: var(--text-sm);
            font-weight: 600;
            font-family: var(--font-ui);
        }
        #undo-pick-btn {
            background: transparent;
            color: var(--text-on-green);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        #undo-pick-btn:hover { background: rgba(255, 255, 255, 0.12); }
        #simulate-pick-btn { background-color: var(--green-700); }
        #simulate-pick-btn:hover { background-color: var(--green-600); }
        #auto-draft-btn {
            background-color: var(--danger);
            color: var(--text-on-green);
            font-weight: 700;
        }
        #auto-draft-btn:hover { background-color: var(--danger-hover); }
        #auto-draft-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .banner-settings,
        .banner-stats {
            position: relative;
        }
        #banner-settings-toggle,
        #banner-stats-toggle {
            padding: var(--space-2) var(--space-3);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-on-green);
            font-size: var(--text-sm);
            cursor: pointer;
            font-family: var(--font-ui);
        }
        #banner-settings-toggle:hover,
        #banner-stats-toggle:hover { background: rgba(255, 255, 255, 0.2); }
        #banner-settings-panel,
        #banner-stats-panel {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            z-index: 1100;
            min-width: 240px;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            background: var(--green-600);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        #banner-settings-panel[hidden],
        #banner-stats-panel[hidden] { display: none; }
        #banner-settings-panel .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        #banner-stats-panel .stats-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            font-size: var(--text-sm);
            color: var(--text-on-green);
        }
        #banner-stats-panel .stats-label { font-weight: 600; }
        #banner-stats-panel .stats-value {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }
        #banner-stats-panel .stats-row.stats-total {
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-1);
        }
        #assistant-banner {
            display: none;
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(255, 193, 7, 0.2);
            color: #fff;
            font-size: 0.85rem;
        }
        #assistant-banner.visible { display: block; }
        #ai-assistant-sliver {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            overflow: hidden;
            --lava-gradient:
                radial-gradient(120% 180% at 0% 50%, #ff8a00 0%, transparent 50%),
                radial-gradient(120% 180% at 100% 50%, #8a2be2 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 0%, #00e5ff 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 100%, #00ff6a 0%, transparent 50%),
                linear-gradient(90deg, #ff0080, #ff8a00, #ffff00, #00ff6a, #00e5ff, #8a2be2, #ff0080);
            --lava-size: 300% 300%;
        }
        #ai-assistant-sliver::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 2px;
            border-radius: inherit;
            background: var(--lava-gradient);
            background-size: var(--lava-size);
            animation: lavaMove 8s ease-in-out infinite, lavaHue 12s linear infinite;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }
        #ai-assistant-sliver[hidden] { display: none; }
        .ai-sliver-main {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            min-height: 40px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            overflow-x: auto;
        }
        .ai-confidence-dot {
            flex-shrink: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #95a5a6;
        }
        .ai-confidence-dot[data-level="high"] { background: #2ecc71; }
        .ai-confidence-dot[data-level="medium"] { background: #f1c40f; }
        .ai-confidence-dot[data-level="low"] { background: #e74c3c; }
        #ai-sliver-primary {
            flex-shrink: 0;
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        #ai-sliver-primary.ai-sliver-loading {
            font-style: italic;
            font-weight: 500;
            opacity: 0.85;
        }
        #ai-sliver-primary.ai-sliver-error {
            color: #ffcdd2;
            font-weight: 500;
        }
        .ai-sliver-alternates {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }
        .ai-sliver-alternate-chip {
            flex-shrink: 0;
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .ai-sliver-meta {
            flex-shrink: 0;
            font-size: 0.8rem;
            opacity: 0.9;
            white-space: nowrap;
        }
        #ai-sliver-toggle,
        #ai-sliver-dismiss {
            flex-shrink: 0;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }
        #ai-sliver-toggle[aria-expanded="true"] {
            transform: rotate(180deg);
        }
        .ai-sliver-drawer {
            position: relative;
            z-index: 1;
            padding: 8px 14px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0 0 6px 6px;
            max-height: 220px;
            overflow-y: auto;
        }
        .ai-sliver-drawer[hidden] { display: none; }
        .ai-sliver-drawer ul {
            margin: 0 0 8px;
            padding-left: 18px;
        }
        .ai-sliver-drawer li { margin-bottom: 4px; }
        .ai-sliver-section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 4px;
        }
        .ai-sliver-degraded-warning {
            color: #ffe082;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .ai-sliver-raw {
            margin-top: 8px;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0.85;
            max-height: 120px;
            overflow: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
        }
        @keyframes lavaHue {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }
        .team-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #team-buttons {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding-bottom: 2px;
            width: 100%;
        }
        /* Team buttons: compact */
        .team-button {
            padding: 4px 8px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1976d2;
            color: white;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .team-button.main-team {
            font-weight: 700;
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.15) 10px,
                rgba(0, 0, 0, 0) 10px,
                rgba(0, 0, 0, 0) 20px
            );
        }
        .team-button.snake-order-pick {
            border-color: #ffc107;
        }
        .team-button.picking-now {
            background-color: #ffc107;
            color: black;
        }
        .team-button.team-full {
            background-color: #6c757d;
            color: #fff;
            opacity: 0.85;
        }

        /* Header actions (legacy selectors kept for button colors above) */

        /* Controls + table */
        #controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); gap: var(--space-3); flex-wrap: wrap; }
        #player-search { padding: var(--space-2); width: 200px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-ui); font-size: var(--text-base); }
        #new-draft-btn { padding: var(--space-2) var(--space-3); background-color: var(--green-500); color: var(--text-on-green); border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-ui); font-weight: 600; }
        #new-draft-btn:hover { background-color: var(--green-600); }
        .gp-filter { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--radius-pill); background: rgba(0,0,0,0.05); }
        .gp-filter span { font-weight: 600; opacity: 0.9; }
        #gp-frac-min { padding: var(--space-2); width: 160px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised); font-family: var(--font-mono); }

        /* Prettier Checkboxes */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            background-color: #fdfdfd;
            margin: 0;
            font: inherit;
            color: #6c757d;
            width: 1.25em;
            height: 1.25em;
            border: 0.1em solid #6c757d;
            border-radius: 0.2em;
            transform: translateY(-0.075em);
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 0.7em;
            height: 0.7em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--green-500);
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        input[type="checkbox"]:focus {
            outline: max(2px, 0.15em) solid var(--green-500);
            outline-offset: max(2px, 0.15em);
        }

        .position-filters label {
            margin-right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        #player-list { border-collapse: collapse; width: 100%; position: relative; font-family: var(--font-stats); }
        #player-list thead th { background-color: var(--header-bg); color: var(--text-on-green); position: sticky; top: -1px; z-index: 100; box-shadow: var(--shadow-sm); font-family: var(--font-ui); font-size: var(--text-sm); letter-spacing: 0.01em; }
        #player-list th.sortable { cursor: pointer; user-select: none; }
        #player-list tbody tr:nth-child(even) { background-color: var(--neutral-bg); }
        #player-list tbody tr:hover { cursor: pointer; }
        #player-list tbody tr:hover td { box-shadow: inset 0 0 100vw 100vh rgba(46, 125, 50, 0.06); }
        #player-list tbody td:nth-child(2),
        #player-list tbody td:nth-child(7),
        #player-list tbody td:nth-child(8),
        #player-list tbody td:nth-child(9),
        #player-list tbody td:nth-child(11) {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }
        #player-list tbody tr.ai-row-primary td {
            box-shadow: inset 3px 0 0 var(--green-500);
            outline: 2px solid rgba(46, 204, 113, 0.85);
            outline-offset: -2px;
        }
        #player-list tbody tr.ai-row-alternate td {
            box-shadow: inset 3px 0 0 var(--on-clock);
            outline: 1.5px solid rgba(241, 196, 15, 0.75);
            outline-offset: -2px;
        }
        #player-list tbody tr.ai-row-primary:hover td {
            box-shadow: inset 3px 0 0 var(--green-500), inset 0 0 100vw 100vh rgba(46, 204, 113, 0.08);
        }
        #player-list tbody tr.ai-row-alternate:hover td {
            box-shadow: inset 3px 0 0 var(--on-clock), inset 0 0 100vw 100vh rgba(241, 196, 15, 0.08);
        }
        #player-list th, #player-list td { border: 1px solid var(--border); padding: var(--space-2); text-align: left; }
        #player-list td:first-child { text-align: center; vertical-align: middle; }

        /* Draft Board Grid */
        #draft-board-container {
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        #draft-board-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
            table-layout: fixed;
        }
        #draft-board-table th, #draft-board-table td {
            border: 1px solid var(--border);
            padding: 4px;
            width: 150px;
            min-width: 150px;
            vertical-align: top;
            overflow: hidden;
        }
        #draft-board-table th {
            background-color: var(--neutral-bg);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .board-team-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: var(--text-sm);
        }
        .board-team-header-btn {
            cursor: pointer;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            border: 2px solid transparent;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .board-team-header-btn:hover {
            background-color: var(--green-50);
        }
        .board-team-header-btn.main-team .board-team-name {
            color: #1976d2;
            font-weight: 700;
        }
        .board-team-header-btn.picking-now {
            background-color: var(--on-clock);
            border-color: var(--on-clock);
            color: #000;
        }
        .board-team-header-btn.picking-now:hover {
            background-color: #ffca28;
        }
        .board-team-header-btn.team-full {
            background-color: var(--neutral-bg);
            opacity: 0.9;
        }
        .board-team-header-btn.snake-order-pick {
            border: 2px solid var(--on-clock);
        }
        .board-team-header-btn.snake-order-pick:not(.picking-now) {
            background-color: var(--on-clock-bg);
        }
        .board-team-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            font-size: var(--text-xs);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }
        .board-team-stats .stat {
            background: rgba(0,0,0,0.05);
            padding: 1px 4px;
            border-radius: 4px;
        }
        .board-bye-week-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            font-size: 0.65rem;
        }
        .board-bye-week-cell {
            padding: 3px 4px;
            text-align: center;
            border-radius: 3px;
            border: 1px solid var(--border);
            min-width: 0;
            line-height: 1.2;
            font-family: var(--font-mono);
        }
        .board-bye-week-cell .bye-week-num {
            font-weight: 700;
            display: block;
        }
        .board-bye-week-cell .bye-week-pos {
            font-size: 0.6rem;
            display: block;
            margin-top: 1px;
        }
        .board-cell {
            min-height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 0.8rem;
            border-radius: 3px;
            padding: 4px;
        }
        .board-cell .pos { font-weight: bold; font-size: 0.7rem; opacity: 0.8; }
        .board-cell .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .board-cell .team { font-size: 0.7rem; opacity: 0.9; }
        .board-cell.empty { background-color: var(--surface); color: var(--text-muted); border: 1px dashed var(--border); }
        .board-cell.on-clock { border: 2px solid var(--on-clock); background-color: var(--on-clock-bg); }

        /* Info column/button */
        #player-list th.info-col, #player-list td.info-col { width: 52px; text-align: center; }
        .info-actions { display: flex; gap: 2px; justify-content: center; align-items: center; }
        .info-button { padding: 2px 5px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer; font-size: var(--text-sm); line-height: 1; }
        #player-list th.role-col, #player-list td.role-col {
            width: 52px;
            text-align: center;
            white-space: nowrap;
        }
        #player-list td.role-col {
            font-size: 0.75rem;
            font-weight: 600;
        }
        #player-list td.role-col.missing { color: #aaa; font-weight: normal; }
        #player-list td.role-col.role-starter { color: #1b5e20; }
        #player-list td.role-col.role-co_starter { color: #2e7d32; }
        #player-list td.role-col.role-committee { color: #b26a00; }
        #player-list td.role-col.role-backup { color: #666; }
        #player-list th.outlook-col { max-width: 180px; }
        #player-list td.outlook-col {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.85rem;
            color: #333;
            cursor: default;
        }
        #player-list td.outlook-col.has-insight { cursor: help; }
        #player-list td.outlook-col.missing { color: #aaa; }
        #outlook-tooltip {
            display: none;
            position: fixed;
            z-index: 900;
            max-width: 320px;
            padding: 10px 12px;
            background: #1f2937;
            color: #f9fafb;
            border-radius: 6px;
            font-size: 0.82rem;
            line-height: 1.45;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        #outlook-tooltip .tooltip-phrase { font-weight: 600; color: #86efac; margin-bottom: 6px; }
        #outlook-tooltip .tooltip-role { font-size: 0.75rem; color: #d1d5db; margin-bottom: 6px; text-transform: capitalize; }
        #outlook-tooltip .tooltip-summary { color: #e5e7eb; }
        #insights-hint { font-size: 0.85rem; color: #666; margin-left: 8px; }
        #insights-hint.missing { color: #999; font-style: italic; }

        /* Insight detail modal */
        #insight-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #insight-modal.open { display: flex; }
        .insight-modal-content {
            background: #fff;
            border-radius: 8px;
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 20px 24px;
        }
        .insight-modal-content h3 { margin: 0 0 4px; font-size: 1.1rem; }
        .insight-modal-phrase { color: var(--green-600); font-weight: 600; margin: 0 0 12px; font-size: 0.95rem; }
        .insight-modal-summary { margin: 0 0 14px; line-height: 1.5; color: #333; }
        .insight-tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .insight-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            background: var(--green-50);
            color: var(--green-700);
            border: 1px solid #c8e6c9;
        }
        .insight-bullets { margin: 0 0 14px; padding-left: 18px; }
        .insight-bullets li { margin-bottom: 6px; font-size: 0.9rem; line-height: 1.4; }
        .insight-bullets a { color: #1565c0; }
        .insight-modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
        .insight-confidence { font-size: 0.8rem; color: #666; text-transform: capitalize; }
        .insight-modal-actions { display: flex; gap: 8px; margin-left: auto; }
        .insight-modal-google {
            padding: 6px 14px;
            border: 1px solid #1565c0;
            border-radius: 4px;
            background: #fff;
            color: #1565c0;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .insight-modal-close {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--neutral-bg);
            cursor: pointer;
            font-family: var(--font-ui);
        }

        /* Rosters */
        .roster-card { border: 1px solid #ccc; border-radius: 4px; padding: 10px; margin-bottom: 10px; background-color: white; }
        .roster-card.full { border-color: #6c757d; background-color: #f1f1f1; }
        .roster-card h4 { margin-top: 0; }
        .roster-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
        .roster-section { flex: 1; }
        .roster-section h5 { margin-top: 0; border-bottom: 2px solid #bbb; padding-bottom: 5px; }
        .roster-section table { width: 100%; border-collapse: collapse; }
        .roster-section td { padding: 4px; font-size: 0.9rem; }
        .roster-section td:first-child { font-weight: bold; width: 40px; }
        .roster-section ul { list-style-type: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
        .roster-section li { font-size: 0.9rem; padding: 2px 0; }
        .player-chip { white-space: normal; word-break: break-word; }

        /* Bye week grid */
        .bye-week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; }
        .bye-week-cell { padding: 5px; text-align: center; border-radius: 3px; font-size: 0.8rem; border: 1px solid #000; }
        /* AI "lava lamp" effect: multi-color gradient for text and ring border */
        .ai-chip {
            /* Static fill like other chips */
            position: relative;
            background: rgba(255, 255, 255, 0.18);
            padding: 4px 10px;
            border-radius: 999px;
            /* Shared animated gradient */
            --lava-gradient: 
                radial-gradient(120% 180% at 0% 50%, #ff8a00 0%, transparent 50%),
                radial-gradient(120% 180% at 100% 50%, #8a2be2 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 0%, #00e5ff 0%, transparent 50%),
                radial-gradient(120% 180% at 50% 100%, #00ff6a 0%, transparent 50%),
                linear-gradient(90deg, #ff0080, #ff8a00, #ffff00, #00ff6a, #00e5ff, #8a2be2, #ff0080);
            --lava-size: 300% 300%;
        }

        #ai-text {
            background: var(--lava-gradient);
            background-size: var(--lava-size);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            animation: lavaMove 8s ease-in-out infinite;
        }

        .ai-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 2px; /* ring thickness */
            border-radius: inherit;
            background: var(--lava-gradient);
            background-size: var(--lava-size);
            animation: lavaMove 8s ease-in-out infinite;
            /* Mask to show only the ring (border area) */
            -webkit-mask: 
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask: 
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes lavaMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Season results styling */
        .standings-table { width: 100%; border-collapse: collapse; }
        .standings-table th, .standings-table td { border: 1px solid #ddd; padding: 6px; }
        .standings-table th { background: #f5f5f5; text-align: left; }
        .standings-table th.num, .standings-table td.num { text-align: right; }
        .playoff-tree { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; padding: 8px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; line-height: 1.3; }
        .playoff-rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
        .playoff-card { border: 1px solid #e5e5e5; background: #fff; border-radius: 8px; padding: 8px; }
        .playoff-card h6 { margin: 0 0 6px; border-bottom: 2px solid #ddd; padding-bottom: 4px; }
        .matchup-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; padding: 4px 0; align-items: center; }
        .matchup-row + .matchup-row { border-top: 1px dashed #eee; }
        .team-name { font-weight: 600; }
        .score { font-variant-numeric: tabular-nums; font-weight: 700; }
        .season-tabs { display: flex; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
        .season-tab { background: #f0f0f0; border: 1px solid #ddd; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
        .season-tab.active { background: #8a2be2; color: #fff; border-color: #8a2be2; }
        .season-panel { display: none; }
        .season-panel.active { display: block; }
        .matchup-card { border: 1px solid #e5e5e5; background: #fff; border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
        .matchup-card .matchup-row { padding: 6px 8px; }
        .matchup-card .matchup-row.winner {
            background: rgba(76, 175, 80, 0.2);
            border-left: 3px solid #2e7d32;
            border-radius: 4px;
            font-weight: 700;
        }
        .matchup-card .matchup-row.winner .team-name { color: #1b5e20; }
        .matchup-card .matchup-row.winner .score { color: #1b5e20; }
        .matchup-card .matchup-row.loser { opacity: 0.55; }
        .matchup-card .matchup-row.loser .score { font-weight: 500; }
        .matchup-card .win-mark {
            color: #2e7d32;
            font-weight: 700;
            min-width: 1.6rem;
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.02em;
        }
        .matchup-card .matchup-row.winner .win-mark {
            background: #2e7d32;
            color: #fff;
            border-radius: 4px;
            padding: 1px 4px;
        }
        .week-accordion { margin-bottom: 8px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
        .week-accordion summary { cursor: pointer; padding: 8px 10px; font-weight: 600; list-style: none; }
        .week-accordion summary::-webkit-details-marker { display: none; }
        .week-accordion summary::before { content: '▸ '; display: inline-block; }
        .week-accordion[open] summary::before { content: '▾ '; }
        .week-accordion-body { padding: 0 10px 10px; }
        .standings-table tr.team-agent td.team-cell { color: #1976d2; font-weight: 700; }
        .standings-table tr.standings-rank-1 { background: rgba(255, 193, 7, 0.1); }
        .standings-table tr.standings-rank-2 { background: rgba(158, 158, 158, 0.08); }
        .standings-table tr.standings-rank-3 { background: rgba(255, 152, 0, 0.08); }
        .standings-table tr.standings-champion td.team-cell { box-shadow: inset 3px 0 0 #8a2be2; }
        .standings-table .rank-cell { width: 3.5rem; white-space: nowrap; }
        .rank-badge {
            display: inline-block;
            min-width: 2.2rem;
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: #fafafa;
            color: #555;
        }
        .rank-badge.rank-1 { background: #fff8e1; color: #f57f17; border-color: #ffca28; }
        .rank-badge.rank-2 { background: #f5f5f5; color: #616161; border-color: #bdbdbd; }
        .rank-badge.rank-3 { background: #fff3e0; color: #e65100; border-color: #ffcc80; }
        .champion-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #ffc107;
            background: linear-gradient(90deg, rgba(255, 193, 7, 0.18), rgba(138, 43, 226, 0.08));
        }
        .champion-banner .champion-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #8a2be2;
            background: #fff;
            border: 1px solid #e1bee7;
            border-radius: 999px;
            padding: 3px 8px;
        }
        .champion-banner .champion-team {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1b5e20;
        }
        .team-champion-tag {
            display: inline-block;
            margin-left: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #6a1b9a;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid #ce93d8;
            border-radius: 999px;
            padding: 1px 6px;
            vertical-align: middle;
        }
        .matchup-row.team-agent .team-name { color: #1976d2; }
    </style>
</head>
<body>
    <header>
        <div class="draft-banner">
            <div class="draft-clock" id="draft-clock" title="Overall pick">
                <span id="round-pick-display">R— · P—</span>
                <span class="draft-clock-sep">·</span>
                <span id="team-on-clock-display">Team —</span>
            </div>
            <div class="draft-banner-ai" id="draft-banner-ai">
                <div class="chip ai-chip" id="ai-chip">
                    <span id="ai-text">AI</span>
                    <div id="ai-suggestion-display">N/A</div>
                </div>
                <section id="ai-assistant-sliver" aria-live="polite" hidden>
                    <div id="ai-sliver-main" class="ai-sliver-main">
                        <span id="ai-sliver-confidence" class="ai-confidence-dot" data-level="" title="Confidence"></span>
                        <button type="button" id="ai-sliver-primary"
                                data-action="draft-recommended"
                                data-player-id=""></button>
                        <div id="ai-sliver-alternates" class="ai-sliver-alternates"></div>
                        <span id="ai-sliver-team" class="ai-sliver-meta"></span>
                        <button type="button" id="ai-sliver-toggle"
                                data-action="toggle-rationale"
                                aria-expanded="false"
                                aria-controls="ai-sliver-drawer">&#8964;</button>
                        <button type="button" id="ai-sliver-dismiss"
                                data-action="dismiss-assistant">Dismiss</button>
                    </div>
                    <div id="ai-sliver-drawer" class="ai-sliver-drawer" hidden>
                        <ul id="ai-sliver-bullets"></ul>
                        <div id="ai-sliver-flags"></div>
                        <div id="ai-sliver-unknowns"></div>
                        <div id="ai-sliver-degraded" hidden></div>
                    </div>
                </section>
            </div>
            <div class="draft-banner-actions">
                <button type="button" id="ask-assistant-btn">Ask</button>
                <button id="undo-pick-btn">Undo</button>
                <button id="simulate-pick-btn">Sim</button>
                <button type="button" id="auto-draft-btn">Auto</button>
                <div class="banner-stats">
                    <button type="button" id="banner-stats-toggle"
                            data-action="toggle-stats"
                            aria-expanded="false"
                            aria-controls="banner-stats-panel"
                            title="Draft stats">Stats</button>
                    <div id="banner-stats-panel" hidden>
                        <div class="stats-row stats-total">
                            <span class="stats-label">Total picks</span>
                            <span class="stats-value" id="total-picks-display">—</span>
                        </div>
                        <div class="stats-row">
                            <span class="stats-label">QB drafted</span>
                            <span class="stats-value" id="qb-drafted-display">—</span>
                        </div>
                        <div class="stats-row">
                            <span class="stats-label">RB drafted</span>
                            <span class="stats-value" id="rb-drafted-display">—</span>
                        </div>
                        <div class="stats-row">
                            <span class="stats-label">WR drafted</span>
                            <span class="stats-value" id="wr-drafted-display">—</span>
                        </div>
                        <div class="stats-row">
                            <span class="stats-label">TE drafted</span>
                            <span class="stats-value" id="te-drafted-display">—</span>
                        </div>
                    </div>
                </div>
                <div class="banner-settings">
                    <button type="button" id="banner-settings-toggle"
                            data-action="toggle-settings"
                            aria-expanded="false"
                            aria-controls="banner-settings-panel"
                            title="Draft settings">Settings</button>
                    <div id="banner-settings-panel" hidden>
                        <div class="settings-row">
                            <label class="assistant-toggle" title="Auto-run assistant on snake turns when scope allows">
                                <input type="checkbox" id="assistant-auto-toggle">
                                Auto assistant
                            </label>
                        </div>
                        <div class="settings-row">
                            <label for="assistant-scope-select">Scope</label>
                            <select id="assistant-scope-select" title="Auto assistant pick scope">
                                <option value="agent_only">My picks only</option>
                                <option value="all_teams">Every team</option>
                            </select>
                        </div>
                        <div class="settings-row">
                            <label class="assistant-model-label" for="assistant-agent-model-select">My model</label>
                            <select id="assistant-agent-model-select" class="assistant-model-select" title="Model for your team's picks"></select>
                        </div>
                        <div class="settings-row">
                            <label class="assistant-model-label" for="assistant-other-model-select">Others</label>
                            <select id="assistant-other-model-select" class="assistant-model-select" title="Model for other teams"></select>
                        </div>
                        <div class="settings-row">
                            <label class="assistant-toggle" title="Sim Pick and Auto Draft engine" for="sim-mode-select">Sim engine</label>
                            <select id="sim-mode-select">
                                <option value="bot">Bot</option>
                                <option value="policy">Policy</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="assistant-banner"></div>
    </header>

    <main>
        <div id="top-panel">
            <div id="controls">
                <input type="text" id="player-search" placeholder="Search by name...">
                <div class="position-filters">
                    <label><input type="checkbox" name="position" value="QB"> QB</label>
                    <label><input type="checkbox" name="position" value="RB"> RB</label>
                    <label><input type="checkbox" name="position" value="WR"> WR</label>
                    <label><input type="checkbox" name="position" value="TE"> TE</label>
                </div>
                <div class="gp-filter"><span>Min GP Frac</span><input type="number" id="gp-frac-min" step="0.01" min="0" max="1" placeholder="e.g., 0.75"></div>
                <span id="insights-hint"></span>
                <button id="new-draft-btn">Start New Draft</button>
            </div>
            <div style="flex: 1; overflow-y: auto;">
                <table id="player-list">
                    <thead>
                        <tr>
                            <th style="width:28px;">Blind</th>
                            <th data-sort-key="adp">ADP</th>
                            <th data-sort-key="name">Name</th>
                            <th class="role-col" title="Projected depth role from offline insights">Role</th>
                            <th class="outlook-col" id="outlook-col-header" title="Research outlook from offline insights">Outlook</th>
                            <th data-sort-key="position">Position</th>
                            <th data-sort-key="projected_points">Proj. Pts</th>
                            <th data-sort-key="vorp">VORP</th>
                            <th data-sort-key="games_played_frac">GP Frac</th>
                            <th data-sort-key="team">Team</th>
                            <th data-sort-key="bye_week">Bye</th>
                            <th title="Sleeper status / injury">Status</th>
                            <th class="info-col">Info</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Player rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="resizer" id="h-resizer"></div>

        <div id="bottom-panel">
            <div id="draft-board-container">
                <table id="draft-board-table">
                    <thead>
                        <tr id="board-headers">

                        <!-- Rows will be inserted here -->

                <button id="simulate-season-btn" style="background-color:#8a2be2; color:#fff; padding:8px 12px; border:none; border-radius:6px; cursor:pointer;">Sim Season</button>

        <div class="tooltip-phrase" id="outlook-tooltip-phrase"></div>
        <div class="tooltip-role" id="outlook-tooltip-role"></div>

                    <button type="button" class="insight-modal-google" id="insight-modal-google">Search Google</button>
                    <button type="button" class="insight-modal-close" id="insight-modal-close">Close</button>
                </div>
