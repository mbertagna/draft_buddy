x-app-base: &app-base
  build: .
  image: draft_buddy:latest
  working_dir: /app
  volumes:
    - .:/app
  env_file: .env
  environment:
    PYTHONPATH: /app/src

services:
  webapp:
    <<: *app-base
    ports:
      - "5001:5001"
    command: python scripts/run_webapp.py
    environment:
      PYTHONPATH: /app/src
      ADVISOR_GEMINI_MODEL: gemini-2.5-flash

  train:
    <<: *app-base
    command: python scripts/train.py

  trades:
    <<: *app-base
    entrypoint: ["python", "scripts/inseason_trades.py"]
    command: ["--help"]

  test:
    <<: *app-base
    command: python -m pytest tests/

  test-cov:
    <<: *app-base
    command: >
      python -m pytest tests/
      --cov=src/draft_buddy
      --cov-branch
      --cov-report=term-missing
      --cov-report=xml:/app/coverage.xml
      --cov-report=html:/app/htmlcov

  data:
    <<: *app-base
    command: python scripts/generate_projections.py

  insights-search:
    <<: *app-base
    command: python scripts/fetch_player_insight_search.py --top-n 10

  insights-synthesize:
    <<: *app-base
    command: python scripts/synthesize_player_insights.py --top-n 10

  position-guide:
    <<: *app-base
    command: python scripts/generate_position_guide.py --simulations 5000
